# v0.5 friction set (pusht-scenarios): T block, default colors, fixed goal,
# stock agent. stock = swm physics (no momentum); slippery = damping 1 +
# floor friction 0.1; mixed = both (env_id 0 = stock, 1 = slippery).
# Train/val split by parent demo; LeWM-style recipe (original base + DINO-WM noise copies).
dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  name: friction_pusht/stock/pusht_v05_friction_stock_train.h5
  keys_to_load:
    - pixels
    - action
    - proprio
    - state
  keys_to_cache:
    - action
    - proprio
    - state
val_set: friction_pusht/stock/pusht_v05_friction_stock_val.h5
